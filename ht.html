<!DOCTYPE html>
<html>

<head>
    <title>Lists Example</title>
</head>

<body>

    <h2>My Hobbies</h2>

    <!-- Unordered List -->
    <h3>Unordered List</h3>
    <ul>
        <li>Playing Chess</li>
        <li>Playing Games</li>
        <li>Listening to Music</li>
    </ul>

    <!-- Ordered List -->
    <h3>Ordered List</h3>
    <ol>
        <li>Wake up</li>
        <li>Have breakfast</li>
        <li>Go to college</li>
    </ol>

</body>

</html>
